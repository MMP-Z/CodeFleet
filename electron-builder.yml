appId: com.codefleet.app
productName: CodeFleet
directories:
  buildResources: build
  output: release
publish:
  provider: github
  owner: codefleet
  repo: codefleet
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!spikes/*'
  - '!scratch/*'
  - '!Document/*'
  - '!electron.vite.config.*'
  - '!{eslint.config.mjs,.prettierrc.json,.prettierignore,tsconfig*.json,vitest.config.ts,tailwind.config.ts,postcss.config.cjs}'
asarUnpack:
  - '**/*.node'
extraResources:
  - from: resources/model-tiers.default.json
    to: resources/model-tiers.default.json
win:
  target:
    - target: nsis
      arch:
        - x64
  executableName: CodeFleet
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: CodeFleet
  deleteAppDataOnUninstall: false
mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  hardenedRuntime: true
  gatekeeperAssess: false
  artifactName: ${productName}-${version}-${os}-${arch}.${ext}
