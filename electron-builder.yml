appId: com.codefleet.app
productName: CodeFleet
directories:
  buildResources: build
  output: release
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!spikes/*'
  - '!Document/*'
  - '!electron.vite.config.*'
  - '!{eslint.config.mjs,.prettierrc.json,.prettierignore,tsconfig*.json,vitest.config.ts,tailwind.config.ts,postcss.config.cjs}'
asarUnpack:
  - '**/*.node'
win:
  target:
    - nsis
  executableName: CodeFleet
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
mac:
  category: public.app-category.developer-tools
  target:
    - dmg
  artifactName: ${name}-${version}-${arch}.${ext}

